<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>川柳句会場アプリ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
    <!-- ログイン画面 -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h1>川柳句会場へようこそ</h1>

            <div id="continue-section" style="display: none;">
                <button id="continue-btn" class="continue-button">前回のつづき</button>
                <p id="saved-info" class="saved-info"></p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>お名前</label>
                    <input type="text" id="name-input" placeholder="本名を入力" required>
                </div>

                <div class="form-group">
                    <label>ニックネーム（日本語6文字、ローマ字12文字まで）</label>
                    <input type="text" id="character-name-input" placeholder="ニックネームを入力" required maxlength="12">
                </div>

                <div class="form-group">
                    <label>キャラクター</label>
                    <select id="gender-select" required>
                        <option value="human">にんげん</option>
                        <option value="cat">ねこ</option>
                        <option value="dog">いぬ</option>
                        <option value="rabbit">うさぎ</option>
                        <option value="lion">らいおん</option>
                        <option value="elephant">ぞう</option>
                        <option value="panda">ぱんだ</option>
                        <option value="sparrow">すずめ</option>
                    </select>
                </div>

                <button type="submit" class="submit-button">入室する</button>
            </form>
        </div>
    </div>

    <!-- メイン画面 -->
    <div id="main-screen" class="screen" style="display: none;">
        <!-- ゲームビュー（教室/お庭） -->
        <div id="game-pane" class="game-pane">
            <div class="game-header">
                <h2 id="location-title">お庭</h2>
                <button id="enter-classroom-btn" class="enter-button">教室に入る</button>
            </div>
            <div id="game-container"></div>
        </div>

        <!-- チャットペイン -->
        <div id="chat-pane" class="chat-pane">
            <!-- ヘッダー -->
            <div class="chat-header">
                <span id="login-info"></span>
            </div>

            <!-- チャット欄 -->
            <div id="chat-area" class="chat-area">
                <h3>チャット</h3>
                <div id="messages-container" class="messages-container"></div>
                <form id="chat-form" class="input-form">
                    <input type="text" id="chat-input" placeholder="メッセージを入力...">
                    <button type="submit">送信</button>
                </form>
            </div>

            <!-- 披講欄（主催者のみ） -->
            <div id="hikikou-area" class="hikikou-area" style="display: none;">
                <h3>披講</h3>
                <div class="hikikou-input-container">
                    <input type="text" id="hikikou-input" placeholder="披講する川柳を入力...">
                    <button id="hikikou-btn" class="hikikou-button">披講ボタン</button>
                </div>
            </div>

            <!-- 投句欄（一般のみ） -->
            <div id="haiku-area" class="haiku-area" style="display: none;">
                <h3>投句（各課題二句まで）</h3>
                <div class="haiku-form">
                    <div class="haiku-tabs">
                        <button type="button" class="haiku-tab-btn active" data-tab="1">課題 <span id="haiku-tab-theme1">①</span></button>
                        <button type="button" class="haiku-tab-btn" data-tab="2">課題 <span id="haiku-tab-theme2">②</span></button>
                    </div>
                    <div id="haiku-inputs-1" class="haiku-inputs" style="display: block;">
                        <div class="haiku-input-row">
                            <input type="text" id="haiku-input-1-1" placeholder="川柳を入力..." maxlength="30">
                            <button type="button" id="haiku-submit-1-1">投句する</button>
                        </div>
                        <div class="haiku-input-row">
                            <input type="text" id="haiku-input-1-2" placeholder="川柳を入力..." maxlength="30">
                            <button type="button" id="haiku-submit-1-2">投句する</button>
                        </div>
                    </div>
                    <div id="haiku-inputs-2" class="haiku-inputs" style="display: none;">
                        <div class="haiku-input-row">
                            <input type="text" id="haiku-input-2-1" placeholder="川柳を入力..." maxlength="30">
                            <button type="button" id="haiku-submit-2-1">投句する</button>
                        </div>
                        <div class="haiku-input-row">
                            <input type="text" id="haiku-input-2-2" placeholder="川柳を入力..." maxlength="30">
                            <button type="button" id="haiku-submit-2-2">投句する</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 作品一覧（主催者のみ） -->
            <div id="haiku-list-area" class="haiku-list-area" style="display: none;">
                <div class="haiku-list-header">
                    <h3>投句作品一覧</h3>
                    <div class="theme-tabs">
                        <button class="theme-tab active" data-tab="1">課題 <span id="tab-theme1">①</span></button>
                        <button class="theme-tab" data-tab="2">課題 <span id="tab-theme2">②</span></button>
                    </div>
                </div>
                <div id="haiku-list-1" class="haiku-list" style="display: block;"></div>
                <div id="haiku-list-2" class="haiku-list" style="display: none;"></div>
            </div>

            <!-- ボタンエリア -->
            <div id="button-area" class="button-area">
                <button id="callout-btn" class="action-button" style="display: none;">呼名する</button>
                <button id="download-log-btn" class="action-button" style="display: none;">ログをダウンロード</button>
                <button id="download-haiku-btn" class="action-button" style="display: none;">投句一覧をダウンロード</button>
                <button id="go-garden-btn" class="action-button">お庭にいく</button>
                <button id="leave-btn" class="action-button">ログイン画面にいく</button>
                <button id="end-session-btn" class="end-button" style="display: none;">句会を終了する</button>
            </div>
        </div>
    </div>

    <script src="js/sprites.js"></script>
    <script src="js/scenes/classroom.js"></script>
    <script src="js/scenes/garden.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
